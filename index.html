<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة المهام | To-Do List</title>
  <link rel="stylesheet" href="./Css/style.css">
</head>
<body>

  <div class="todo-card">
    <h1>قائمة المهام 📝</h1>

    <form id="todo-form" class="input-group">
      <input type="text" id="todo-input" placeholder="أضف مهمة جديدة..." autocomplete="off">
      <button type="submit" class="btn-add">إضافة</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>
  </div>
  <script src="./main.js"></script>
</body>
</html>
